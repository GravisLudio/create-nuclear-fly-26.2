plugins {
    id 'idea'
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = mod_version
group = mod_group_id

base {
    archivesName = "create-nuclear-fly"
}

loom {
    // Un solo source set, como la version NeoForge y como el port de Connected: el aislamiento de
    // entorno queda en @Environment(EnvType.CLIENT) y en el bloque "client" del config de mixins.
    accessWidenerPath = file("src/main/resources/createnuclear.classtweaker")

    mods {
        "createnuclear" {
            sourceSet sourceSets.main
        }
    }

}

sourceSets.main.java {
    // Integraciones con mods sin release en 26.2. Se conservan en el repo, fuera del compilado.
    exclude 'net/nuclearteam/createnuclear/compat/alexscave/**'   // Alex's Caves
    // Datagen de NeoForge/Registrate: los JSON ya generados para 1.21.1 estan committeados en
    // src/generated/resources y se migran a los formatos de 26.2 en vez de regenerarse.
    exclude 'net/nuclearteam/createnuclear/infrastructure/data/**'
    exclude 'net/nuclearteam/createnuclear/foundation/data/**'
    exclude 'net/nuclearteam/createnuclear/gametest/**'
    exclude 'net/nuclearteam/createnuclear/api/data/**'
    // Generadores de blockstate de Registrate: sin referencias una vez quitado .blockstate(...).
    exclude 'net/nuclearteam/createnuclear/content/multiblock/**/*Generator.java'
    // Bootstrap del worldgen (datagen): el bioma, el ruido, las density functions y las features
    // ya estan como JSON en src/generated/resources/data/createnuclear/worldgen.
    exclude 'net/nuclearteam/createnuclear/infrastructure/worldgen/CNConfiguredFeatures.java'
    exclude 'net/nuclearteam/createnuclear/infrastructure/worldgen/CNLayerPatterns.java'
    exclude 'net/nuclearteam/createnuclear/infrastructure/worldgen/biome/IrradiatedBiomes.java'
    exclude 'net/nuclearteam/createnuclear/infrastructure/worldgen/biome/CNNoiseGeneratorSettings.java'
    exclude 'net/nuclearteam/createnuclear/infrastructure/worldgen/biome/CNNoiseData.java'
    exclude 'net/nuclearteam/createnuclear/infrastructure/worldgen/biome/CNDensityFunctions.java'
    exclude 'net/nuclearteam/createnuclear/infrastructure/worldgen/biome/surfacerule/IrradiatedSurfaceRules.java'
    // La condicion de superficie "createnuclear:biome_tag" solo la usaba IrradiatedSurfaceRules
    // (datagen); ningun JSON committeado la nombra. Registrarla exigiria abrir SurfaceRules$Context,
    // LazyYCondition y Context.biome en el classtweaker para nada.
    exclude 'net/nuclearteam/createnuclear/infrastructure/worldgen/biome/surfacerule/BiomeTagRule.java'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

fabricApi {
    // src/gametest: a client game test that creates a world, spawns the mod's content and takes
    // screenshots (build/run/clientGameTest/screenshots). Not packaged with the mod.
    // `gradlew runClientGameTest`.
    // Server game tests (`gradlew runGameTest`): a headless dedicated server that loads every
    // datapack, runs CreateNuclearServerGameTest and exits. No EULA needed.
    configureTests {
        createSourceSet = true
        modId = "createnuclear-gametest"
        enableGameTests = true
        enableClientGameTests = true
        eula = false
    }
}

dependencies {
    gametestImplementation fabricApi.module("fabric-client-gametest-api-v1", fabric_version)
    gametestImplementation fabricApi.module("fabric-gametest-api-v1", fabric_version)
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"

    // El artefacto fabric-api es un contenedor sin clases propias: hay que nombrar cada modulo
    // que se usa para que llegue al classpath de compilacion (ver PORTING.md de Connected).
    implementation fabricApi.module("fabric-api-base", fabric_version)
    implementation fabricApi.module("fabric-creative-tab-api-v1", fabric_version)
    implementation fabricApi.module("fabric-lifecycle-events-v1", fabric_version)
    implementation fabricApi.module("fabric-networking-api-v1", fabric_version)
    implementation fabricApi.module("fabric-object-builder-api-v1", fabric_version)
    implementation fabricApi.module("fabric-resource-conditions-api-v1", fabric_version)
    implementation fabricApi.module("fabric-rendering-v1", fabric_version)
    implementation fabricApi.module("fabric-transfer-api-v1", fabric_version)
    implementation fabricApi.module("fabric-data-attachment-api-v1", fabric_version)
    implementation fabricApi.module("fabric-entity-events-v1", fabric_version)
    implementation fabricApi.module("fabric-events-interaction-v0", fabric_version)
    implementation fabricApi.module("fabric-biome-api-v1", fabric_version)
    implementation fabricApi.module("fabric-item-api-v1", fabric_version)
    implementation fabricApi.module("fabric-command-api-v2", fabric_version)
    implementation fabricApi.module("fabric-registry-sync-v0", fabric_version)
    implementation fabricApi.module("fabric-particles-v1", fabric_version)
    implementation fabricApi.module("fabric-menu-api-v1", fabric_version)
    implementation fabricApi.module("fabric-convention-tags-v2", fabric_version)
    implementation fabricApi.module("fabric-loot-api-v3", fabric_version)
    implementation fabricApi.module("fabric-resource-loader-v1", fabric_version)
    implementation fabricApi.module("fabric-key-mapping-api-v1", fabric_version)
    implementation fabricApi.module("fabric-content-registries-v0", fabric_version)
    implementation fabricApi.module("fabric-recipe-api-v1", fabric_version)
    runtimeOnly "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Create Fly: trae Flywheel, Ponder y Catnip embebidos. `implementation` y no
    // `modImplementation`: en Loom 1.16 / MC 26.2 no hay remapeo y las configuraciones mod* no existen.
    implementation "maven.modrinth:create-fly:${create_fly_version}"

    // JEI: solo para compilar el plugin; en runtime es opcional (entrypoint jei_mod_plugin).
    compileOnly "maven.modrinth:jei:${jei_version}"
}

processResources {
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    filteringCharset = 'UTF-8'

    var replaceProperties = [
            minecraft_version: minecraft_version,
            loader_version   : loader_version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_license      : mod_license,
            mod_version      : mod_version,
            mod_authors      : mod_authors,
            mod_description  : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    // Durante el port necesitamos la lista COMPLETA de errores como worklist.
    options.compilerArgs << '-Xmaxerrs' << '10000' << '-Xmaxwarns' << '10000'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from('LICENCE') { rename { "${it}_createnuclear" } }
    from('NOTICE') { rename { "${it}_createnuclear" } }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Escribe el classpath de compilacion en build/cp.txt para tools/jp.sh (javap contra los jars
// exactos que usa el build, no contra lo que haya en la cache).
tasks.register('writeClasspath') {
    def out = layout.buildDirectory.file('cp.txt')
    def cp = sourceSets.main.compileClasspath
    outputs.file(out)
    doLast {
        out.get().asFile.text = cp.files.collect { it.absolutePath }.join(File.pathSeparator)
    }
}
