org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Loom no se lleva bien con el configuration cache; Create Fly tambien lo desactiva.
org.gradle.configuration-cache=false

# JDK 25 explicito para este proyecto, para no tocar el JAVA_HOME del sistema.
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-25.0.4.101-hotspot

## Environment Properties
# Alineado con Create Fly 26.2-rc-2-6.0.9-1 y con los ports de Connected, Dragons Plus y EI.
minecraft_version = 26.2-rc-2
loader_version    = 0.19.3
loom_version      = 1.16-SNAPSHOT
fabric_version    = 0.152.0+26.2

## Dependency Properties
# Create Fly reemplaza a Create + Flywheel + Ponder + Catnip: los embebe a todos.
# No hay Registrate ni Porting Lib en 26.2 -- ver foundation/registrate.
create_fly_version = 26.2-rc-2-6.0.9-1
# Id de version de Modrinth (jei-26.2-fabric-30.26.0.182), igual que en Connected.
jei_version        = x6nG9OT2

## Mod Properties
# El mod id se conserva: mundos y datapacks de Create Nuclear siguen apuntando a createnuclear:*.
mod_id          = createnuclear
mod_name        = Create Nuclear Fly
mod_license     = MIT
mod_version     = 2.0.0-mc26.2-alpha.1
mod_group_id    = net.nuclearteam.createnuclear
mod_authors     = Create Nuclear Team
mod_description = Unofficial port of Create Nuclear to Fabric 26.2, built on ZurrTum's Create Fly. Not an official release and not maintained by the Create Nuclear Team.
